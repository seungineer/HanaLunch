name: Generate and Publish Lunch RSS

on:
  schedule:
    - cron: '55 22 * * 0-4'
  workflow_dispatch:

jobs:
  generate_rss:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Generate RSS XML
        run: python lunch_bot_rss.py

      - name: Move XML to /docs folder
        run: |
          mkdir -p docs
          mv lunch_rss.xml docs/lunch_rss.xml

      - name: Commit and Push Updated RSS
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add docs/lunch_rss.xml
          git commit -m "Update lunch menu RSS feed"
          git push
