name: Test Image Generation

on:
  workflow_dispatch:  # 수동 실행 버튼을 GitHub에서 보여줌

jobs:
  test-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install openai requests

      - name: Run image generation script
        env:
          OPENAI_API_KEY: "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"
        run: |
          python launch_image_test.py

      - name: Commit and push generated image
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Add test image for $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push
